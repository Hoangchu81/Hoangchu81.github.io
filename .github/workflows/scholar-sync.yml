name: Scholar Sync

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch Google Scholar profile
        run: |
          python - <<'PY'
          import json, re, urllib.request
          url = 'https://scholar.google.com/citations?user=tcJwNTsAAAAJ&hl=vi&cstart=0&pagesize=100'
          req = urllib.request.Request(url, headers={'User-Agent':'Mozilla/5.0'})
          html = urllib.request.urlopen(req, timeout=30).read().decode('utf-8', 'ignore')
          rows = re.findall(r'<tr class="gsc_a_tr">(.*?)</tr>', html, re.DOTALL)
          pubs = []
          for i,row in enumerate(rows):
            title_m = re.search(r'<a[^>]*class="gsc_a_at"[^>]*>(.*?)</a>', row)
            blocks = re.findall(r'<div class="gs_gray">(.*?)</div>', row)
            cite_m = re.search(r'<a[^>]*class="gsc_a_ac[^"]*"[^>]*>(.*?)</a>', row)
            if not title_m:
              continue
            title = re.sub(r'<[^>]+>', '', title_m.group(1)).strip()
            authors = re.sub(r'<[^>]+>', '', blocks[0]).strip() if len(blocks) > 0 else ''
            venue_year = re.sub(r'<[^>]+>', '', blocks[1]).strip() if len(blocks) > 1 else ''
            year_m = re.search(r'(19|20)\d{2}', venue_year)
            year = year_m.group(0) if year_m else ''
            venue = venue_year.replace(', ' + year, '').strip() if year else venue_year
            citations = re.sub(r'<[^>]+>', '', cite_m.group(1)).strip() if cite_m else '0'
            topic = 'STI'
            t = (title + ' ' + venue).lower()
            if any(x in t for x in ['heart', 'ecg', 'biomedical', 'hypertension', 'healthcare']): topic = 'Biomedical'
            elif any(x in t for x in ['ai', 'yolo', 'fuzzy', 'machine learning', 'robot', 'iot', 'smart']): topic = 'AI'
            elif any(x in t for x in ['digital health']): topic = 'Digital Health'
            pubs.append({'id': f'scholar-{i+1}', 'title': title, 'authors': authors, 'venue': venue, 'year': year, 'citations': citations, 'topic': topic, 'url': ''})
          with open('data/publications.json','w',encoding='utf-8') as f:
            json.dump(pubs, f, ensure_ascii=False, indent=2)
          print('Wrote', len(pubs), 'publications')
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git diff --cached --quiet || git commit -m "Auto-sync Google Scholar publications"
          git push
