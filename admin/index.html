<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Editorial Admin — TS. Chử Đức Hoàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--fg:#101014;--muted:#666a73;--line:#e7e0d5;--accent:#123a72;--accent2:#1d4ed8;--paper:#fffefc;--bg:#f8f4ed;--soft:#f4efe7;--ok:#166534;--warn:#92400e;--radius:18px;--shadow:0 24px 80px rgba(16,16,20,.10)}*{box-sizing:border-box}body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:linear-gradient(180deg,#fffefb,#f8f4ed);color:var(--fg);line-height:1.5}a{color:var(--accent);text-decoration:none}h1,h2,h3{font-family:'Crimson Pro',Georgia,serif;margin:0}.wrap{max-width:1240px;margin:auto;padding:20px}header{background:rgba(255,254,252,.9);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;z-index:60}header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px}header h1{font-size:22px}.back{font-size:14px;font-weight:700;color:var(--muted)}.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}.tab{padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer}.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}.panel{display:none}.panel.active{display:block}.toolbar{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap;align-items:center}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:var(--accent2)}.btn.secondary{background:var(--soft)}.btn.success{background:var(--ok);border-color:var(--ok);color:#fff}.status{padding:10px 14px;border-radius:12px;background:var(--soft);font-size:13px;color:var(--muted)}input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;background:#fff;transition:.2s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}.search{max-width:320px}.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:var(--paper);box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}th{background:var(--soft);font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:none}tr:hover td{background:#fcfaf6}.badge{display:inline-block;padding:4px 10px;border-radius:999px;font-size:11px;font-weight:700}.badge.sti{background:#ecfdf5;color:#059669}.badge.ai{background:#eff6ff;color:#2563eb}.badge.health{background:#fdf4ff;color:#9333ea}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:6px 10px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;background:#eef2ff;color:var(--fg)}.actions button:hover{background:#dbeafe}.actions .del:hover{background:#fee2e2;color:#dc2626}.actions .cite:hover{background:#fef3c7;color:#92400e}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:120;place-items:center;padding:20px}.modal-overlay.open{display:grid}.modal{background:#fff;border-radius:22px;padding:28px;width:min(860px,96vw);max-height:92vh;overflow-y:auto;box-shadow:0 24px 80px rgba(0,0,0,.18)}.modal h2{margin-bottom:16px;font-size:28px}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--muted)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px;flex-wrap:wrap}.wysiwyg{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.wysiwyg-toolbar{display:flex;gap:4px;flex-wrap:wrap;padding:8px;background:var(--soft);border-bottom:1px solid var(--line)}.wysiwyg-toolbar button,.wysiwyg-toolbar select{padding:7px 10px;border:none;border-radius:8px;cursor:pointer;font-size:13px;background:#fff;font-weight:700;width:auto}.wysiwyg-toolbar button:hover{background:#e5edff}.wysiwyg-editor{min-height:180px;padding:14px;outline:none;font-size:14px;line-height:1.7}.wysiwyg-editor img{max-width:100%;border-radius:10px}.upload-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.preview{width:140px;height:90px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--soft)}.mini{font-size:12px;color:var(--muted)}.citation-box{background:var(--soft);border-radius:12px;padding:14px;font-family:ui-monospace,Consolas,monospace;font-size:13px;white-space:pre-wrap;word-break:break-word}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:20px}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:840px){.form-row,.form-3,.two-col{grid-template-columns:1fr}.toolbar{flex-direction:column;align-items:stretch}.search{max-width:none}}
</style>
</head>
<body>
<header><div class="wrap"><h1>Editorial Admin</h1><a class="back" href="../index.html">← Về trang chủ</a></div></header>
<div class="wrap">
<div class="tabs">
<button class="tab active" data-panel="newsPanel">Tin tức</button>
<button class="tab" data-panel="pubsPanel">Bài báo khoa học</button>
</div>

<section id="newsPanel" class="panel active">
<div class="toolbar">
<button class="btn primary" onclick="openNewsModal()">+ Thêm tin mới</button>
<button class="btn" onclick="exportNewsJSON()">📥 Export news</button>
<button class="btn" onclick="importNewsJSON()">📤 Import news</button>
<button class="btn success" onclick="publishNewsToGitHub()">🚀 Publish news</button>
<input type="file" id="newsImportFile" accept=".json" style="display:none" onchange="handleNewsImport(event)">
<input class="search" type="search" placeholder="🔍 Tìm tin bài..." oninput="filterNews(this.value)">
<select style="width:auto" onchange="filterNewsCat(this.value)"><option value="">Tất cả danh mục</option><option value="STI Policy">STI Policy</option><option value="AI & Digital">AI & Digital</option><option value="Digital Health">Digital Health</option><option value="Khác">Khác</option></select>
<div class="status" id="newsStatus">News ready</div>
</div>
<div class="table-wrap"><table><thead><tr><th width="30"></th><th>#</th><th>Tiêu đề</th><th>Ảnh</th><th>Nguồn</th><th>Danh mục</th><th>Ngày</th><th width="150">Thao tác</th></tr></thead><tbody id="newsBody"></tbody></table></div>
</section>

<section id="pubsPanel" class="panel">
<div class="toolbar">
<button class="btn primary" onclick="openPubModal()">+ Thêm bài báo</button>
<button class="btn secondary" onclick="syncScholarNow()">🔄 Đồng bộ Scholar</button>
<button class="btn" onclick="exportPubsJSON()">📥 Export pubs</button>
<button class="btn" onclick="importPubsJSON()">📤 Import pubs</button>
<button class="btn success" onclick="publishPubsToGitHub()">🚀 Publish pubs</button>
<input type="file" id="pubsImportFile" accept=".json" style="display:none" onchange="handlePubsImport(event)">
<input class="search" type="search" placeholder="🔍 Tìm bài báo..." oninput="filterPubs(this.value)">
<select style="width:auto" onchange="filterPubTopic(this.value)"><option value="">Tất cả chủ đề</option><option value="STI">STI</option><option value="AI">AI</option><option value="Biomedical">Biomedical</option><option value="Digital Health">Digital Health</option></select>
<div class="status" id="pubStatus">Scholar sync daily via VPS cron</div>
</div>
<div class="table-wrap"><table><thead><tr><th>#</th><th>Title</th><th>Authors</th><th>Venue</th><th>Year</th><th>Cites</th><th>Topic</th><th width="180">Thao tác</th></tr></thead><tbody id="pubsBody"></tbody></table></div>
</section>
</div>

<input type="file" id="imageUploadInput" accept="image/*" style="display:none" onchange="handleImageUpload(event)">

<div class="modal-overlay" id="newsModalOverlay" onclick="if(event.target===this)closeNewsModal()"><div class="modal"><h2 id="newsModalTitle">Thêm tin mới</h2>
<div class="form-group"><label>Tiêu đề *</label><input id="nTitle"></div>
<div class="form-row"><div class="form-group"><label>Nguồn</label><input id="nSource"></div><div class="form-group"><label>Ngày đăng</label><input id="nDate" type="date"></div></div>
<div class="form-row"><div class="form-group"><label>URL bài viết</label><input id="nUrl" type="url"></div><div class="form-group"><label>Danh mục</label><select id="nCat"><option value="STI Policy">STI Policy</option><option value="AI & Digital">AI & Digital</option><option value="Digital Health">Digital Health</option><option value="Khác">Khác</option></select></div></div>
<div class="form-group"><label>Ảnh minh hoạ</label><div class="upload-row"><input id="nImage" placeholder="URL ảnh hoặc upload bên dưới"><button class="btn" type="button" onclick="triggerUpload('news-image')">Upload ảnh</button><img id="nPreview" class="preview" alt="preview"></div><div class="mini">Upload sẽ nhúng ảnh dạng data URL vào JSON.</div></div>
<div class="form-group"><label>Nội dung tóm tắt / teaser</label>
<div class="wysiwyg"><div class="wysiwyg-toolbar"><select onchange="formatBlock(event,'nExcerpt')"><option value="">Paragraph</option><option value="h2">H2</option><option value="h3">H3</option><option value="blockquote">Quote</option></select><button type="button" onclick="execCmd('bold','nExcerpt')"><b>B</b></button><button type="button" onclick="execCmd('italic','nExcerpt')"><i>I</i></button><button type="button" onclick="execCmd('underline','nExcerpt')"><u>U</u></button><button type="button" onclick="execCmd('strikeThrough','nExcerpt')">S</button><button type="button" onclick="execCmd('insertUnorderedList','nExcerpt')">• List</button><button type="button" onclick="execCmd('insertOrderedList','nExcerpt')">1. List</button><button type="button" onclick="createLink('nExcerpt')">🔗 Link</button><button type="button" onclick="insertImageIntoEditor('nExcerpt')">🖼 Ảnh</button><button type="button" onclick="execCmd('justifyLeft','nExcerpt')">⟸</button><button type="button" onclick="execCmd('justifyCenter','nExcerpt')">≡</button><button type="button" onclick="execCmd('removeFormat','nExcerpt')">✕</button></div><div class="wysiwyg-editor" id="nExcerpt" contenteditable="true"></div></div></div>
<div class="form-actions"><button class="btn" onclick="closeNewsModal()">Hủy</button><button class="btn primary" onclick="saveNews()">Lưu tin</button></div>
</div></div>

<div class="modal-overlay" id="pubModalOverlay" onclick="if(event.target===this)closePubModal()"><div class="modal"><h2 id="pubModalTitle">Thêm bài báo</h2>
<div class="form-group"><label>Tiêu đề *</label><input id="pTitle"></div>
<div class="form-group"><label>Authors</label><textarea id="pAuthors"></textarea></div>
<div class="form-row"><div class="form-group"><label>Venue</label><input id="pVenue"></div><div class="form-group"><label>Topic</label><select id="pTopic"><option value="STI">STI</option><option value="AI">AI</option><option value="Biomedical">Biomedical</option><option value="Digital Health">Digital Health</option></select></div></div>
<div class="form-3"><div class="form-group"><label>Year</label><input id="pYear" type="number"></div><div class="form-group"><label>Citations</label><input id="pCitations" type="number"></div><div class="form-group"><label>URL / DOI</label><input id="pUrl"></div></div>
<div class="form-actions"><button class="btn" onclick="closePubModal()">Hủy</button><button class="btn primary" onclick="savePub()">Lưu bài báo</button></div>
</div></div>

<div class="modal-overlay" id="citationModal" onclick="if(event.target===this)closeCitationModal()"><div class="modal"><h2>Export citation</h2><div class="two-col"><div><div class="form-group"><label>APA</label><div class="citation-box" id="citeAPA"></div></div><div class="form-group"><label>MLA</label><div class="citation-box" id="citeMLA"></div></div></div><div><div class="form-group"><label>Chicago</label><div class="citation-box" id="citeChicago"></div></div><div class="form-group"><label>BibTeX</label><div class="citation-box" id="citeBib"></div></div></div></div><div class="form-actions"><button class="btn" onclick="copyCitation('citeAPA')">Copy APA</button><button class="btn" onclick="copyCitation('citeBib')">Copy BibTeX</button><button class="btn primary" onclick="closeCitationModal()">Đóng</button></div></div></div>

<script>
let news=[], pubs=[];
let editingNewsId=null, editingPubId=null, uploadTarget='';
let newsFilter='', newsCat='', pubFilter='', pubTopic='';
const NEWS_URL='../data/news.json', PUBS_URL='../data/publications.json';
const NEWS_PATH='data/news.json', PUBS_PATH='data/publications.json';
const GH_REPO='Hoangchu81/Hoangchu81.github.io', GH_BRANCH='main';

// tabs
for(const t of document.querySelectorAll('.tab')) t.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.panel).classList.add('active')};

function esc(s){return String(s||'').replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]))}
function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function catClass(c){if((c||'').includes('STI'))return'sti';if((c||'').includes('AI'))return'ai';if((c||'').includes('Health')||(c||'').includes('Biomedical'))return'health';return''}
function setStatus(id,msg){document.getElementById(id).textContent=msg}

async function loadAll(){await Promise.all([loadNews(),loadPubs()])}
async function loadNews(){try{const r=await fetch(NEWS_URL+'?t='+Date.now());news=await r.json();renderNews();setStatus('newsStatus',`News loaded: ${news.length}`)}catch(e){news=JSON.parse(localStorage.getItem('news_data')||'[]');renderNews();setStatus('newsStatus','Loaded from localStorage')}}
async function loadPubs(){try{const r=await fetch(PUBS_URL+'?t='+Date.now());pubs=await r.json();renderPubs();setStatus('pubStatus',`Publications loaded: ${pubs.length} · Scholar sync daily via VPS cron`)}catch(e){pubs=JSON.parse(localStorage.getItem('pubs_data')||'[]');renderPubs();setStatus('pubStatus','Loaded from localStorage')}}

function persistNews(){localStorage.setItem('news_data',JSON.stringify(news));renderNews()}
function persistPubs(){localStorage.setItem('pubs_data',JSON.stringify(pubs));renderPubs()}

function renderNews(){let data=news;if(newsFilter){const q=newsFilter.toLowerCase();data=data.filter(n=>(n.title+n.source+n.excerpt).toLowerCase().includes(q))}if(newsCat)data=data.filter(n=>n.category===newsCat);const body=document.getElementById('newsBody');body.innerHTML=data.map((n,i)=>`<tr><td>⠿</td><td>${i+1}</td><td><a href="${esc(n.url)}" target="_blank">${esc(n.title)}</a></td><td>${n.image?'<img src="'+esc(n.image)+'" style="width:64px;height:44px;object-fit:cover;border-radius:8px">':'—'}</td><td>${esc(n.source)}</td><td><span class="badge ${catClass(n.category)}">${esc(n.category)}</span></td><td>${n.date||''}</td><td><div class="actions"><button onclick="editNews('${n.id}')">✏️</button><button class="del" onclick="deleteNews('${n.id}')">🗑</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có tin bài nào</td></tr>'}
function renderPubs(){let data=pubs;if(pubFilter){const q=pubFilter.toLowerCase();data=data.filter(p=>(p.title+p.authors+p.venue).toLowerCase().includes(q))}if(pubTopic)data=data.filter(p=>p.topic===pubTopic);const body=document.getElementById('pubsBody');body.innerHTML=data.map((p,i)=>`<tr><td>${i+1}</td><td>${esc(p.title)}</td><td>${esc(p.authors)}</td><td>${esc(p.venue)}</td><td>${esc(p.year)}</td><td>${esc(p.citations)}</td><td><span class="badge ${catClass(p.topic)}">${esc(p.topic)}</span></td><td><div class="actions"><button onclick="editPub('${p.id||i}')">✏️</button><button class="cite" onclick="showCitation('${p.id||i}')">Cite</button><button class="del" onclick="deletePub('${p.id||i}')">🗑</button></div></td></tr>`).join('')||'<tr><td colspan="8" class="empty">Chưa có bài báo</td></tr>'}

function filterNews(v){newsFilter=v;renderNews()} function filterNewsCat(v){newsCat=v;renderNews()} function filterPubs(v){pubFilter=v;renderPubs()} function filterPubTopic(v){pubTopic=v;renderPubs()}

// full-ish wysiwyg
function focusEditor(id){document.getElementById(id).focus()}
function execCmd(cmd,id){focusEditor(id);document.execCommand(cmd,false,null)}
function formatBlock(e,id){if(!e.target.value)return;focusEditor(id);document.execCommand('formatBlock',false,e.target.value);e.target.value=''}
function createLink(id){focusEditor(id);const url=prompt('Nhập URL:');if(url)document.execCommand('createLink',false,url)}
function insertImageIntoEditor(id){uploadTarget='editor:'+id;document.getElementById('imageUploadInput').click()}
function triggerUpload(target){uploadTarget=target;document.getElementById('imageUploadInput').click()}
function handleImageUpload(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{const dataUrl=ev.target.result;if(uploadTarget==='news-image'){document.getElementById('nImage').value=dataUrl;document.getElementById('nPreview').src=dataUrl}else if(uploadTarget.startsWith('editor:')){const id=uploadTarget.split(':')[1];focusEditor(id);document.execCommand('insertImage',false,dataUrl)}};r.readAsDataURL(f);e.target.value=''}

// news modal
function openNewsModal(){editingNewsId=null;document.getElementById('newsModalTitle').textContent='Thêm tin mới';document.getElementById('nTitle').value='';document.getElementById('nSource').value='';document.getElementById('nDate').value=new Date().toISOString().slice(0,10);document.getElementById('nUrl').value='';document.getElementById('nCat').value='STI Policy';document.getElementById('nImage').value='';document.getElementById('nPreview').src='';document.getElementById('nExcerpt').innerHTML='';document.getElementById('newsModalOverlay').classList.add('open')}
function editNews(id){const n=news.find(x=>x.id===id);if(!n)return;editingNewsId=id;document.getElementById('newsModalTitle').textContent='Sửa tin';document.getElementById('nTitle').value=n.title||'';document.getElementById('nSource').value=n.source||'';document.getElementById('nDate').value=n.date||'';document.getElementById('nUrl').value=n.url||'';document.getElementById('nCat').value=n.category||'STI Policy';document.getElementById('nImage').value=n.image||'';document.getElementById('nPreview').src=n.image||'';document.getElementById('nExcerpt').innerHTML=n.excerpt||'';document.getElementById('newsModalOverlay').classList.add('open')}
function closeNewsModal(){document.getElementById('newsModalOverlay').classList.remove('open')}
function saveNews(){const title=document.getElementById('nTitle').value.trim();if(!title)return alert('Nhập tiêu đề');const obj={id:editingNewsId||genId(),title,source:document.getElementById('nSource').value.trim(),date:document.getElementById('nDate').value,url:document.getElementById('nUrl').value.trim(),category:document.getElementById('nCat').value,image:document.getElementById('nImage').value.trim(),excerpt:document.getElementById('nExcerpt').innerHTML.trim()};if(editingNewsId){const i=news.findIndex(x=>x.id===editingNewsId);news[i]=obj}else news.unshift(obj);persistNews();closeNewsModal();setStatus('newsStatus','News updated locally')}
function deleteNews(id){if(!confirm('Xóa tin này?'))return;news=news.filter(x=>x.id!==id);persistNews()}
function exportNewsJSON(){downloadJSON(news,'news.json')} function importNewsJSON(){document.getElementById('newsImportFile').click()} function handleNewsImport(e){readJsonFile(e,d=>{news=d;persistNews();setStatus('newsStatus',`Imported ${d.length} news`)})}

// pubs modal
function normalizePubId(p,i){if(!p.id)p.id='pub-'+i;return p}
function openPubModal(){editingPubId=null;document.getElementById('pubModalTitle').textContent='Thêm bài báo';['pTitle','pAuthors','pVenue','pYear','pCitations','pUrl'].forEach(id=>document.getElementById(id).value='');document.getElementById('pTopic').value='STI';document.getElementById('pubModalOverlay').classList.add('open')}
function editPub(id){const p=pubs.map(normalizePubId).find(x=>x.id===id);if(!p)return;editingPubId=id;document.getElementById('pubModalTitle').textContent='Sửa bài báo';document.getElementById('pTitle').value=p.title||'';document.getElementById('pAuthors').value=p.authors||'';document.getElementById('pVenue').value=p.venue||'';document.getElementById('pYear').value=p.year||'';document.getElementById('pCitations').value=p.citations||'';document.getElementById('pUrl').value=p.url||'';document.getElementById('pTopic').value=p.topic||'STI';document.getElementById('pubModalOverlay').classList.add('open')}
function closePubModal(){document.getElementById('pubModalOverlay').classList.remove('open')}
function savePub(){const title=document.getElementById('pTitle').value.trim();if(!title)return alert('Nhập title');const obj={id:editingPubId||genId(),title,authors:document.getElementById('pAuthors').value.trim(),venue:document.getElementById('pVenue').value.trim(),year:String(document.getElementById('pYear').value||''),citations:String(document.getElementById('pCitations').value||''),url:document.getElementById('pUrl').value.trim(),topic:document.getElementById('pTopic').value};pubs=pubs.map(normalizePubId);if(editingPubId){const i=pubs.findIndex(x=>x.id===editingPubId);pubs[i]=obj}else pubs.unshift(obj);persistPubs();closePubModal();setStatus('pubStatus','Publications updated locally')}
function deletePub(id){if(!confirm('Xóa bài báo này?'))return;pubs=pubs.map(normalizePubId).filter(x=>x.id!==id);persistPubs()}
function exportPubsJSON(){downloadJSON(pubs,'publications.json')} function importPubsJSON(){document.getElementById('pubsImportFile').click()} function handlePubsImport(e){readJsonFile(e,d=>{pubs=d.map(normalizePubId);persistPubs();setStatus('pubStatus',`Imported ${d.length} publications`)})}

// citation export
function formatAuthorsAPA(a){return a||''}
function citationAPA(p){return `${formatAuthorsAPA(p.authors)} (${p.year||'n.d.'}). ${p.title}. ${p.venue}.`}
function citationMLA(p){return `${p.authors}. "${p.title}." ${p.venue}, ${p.year||'n.d.'}.`}
function citationChicago(p){return `${p.authors}. ${p.year||'n.d.'}. "${p.title}." ${p.venue}.`}
function citationBib(p){const key=((p.authors||'author').split(',')[0].replace(/[^A-Za-z]/g,'')||'author')+(p.year||'nd');return `@article{${key},\n  title={${p.title}},\n  author={${p.authors}},\n  journal={${p.venue}},\n  year={${p.year||''}},\n  url={${p.url||''}}\n}`}
function showCitation(id){const p=pubs.map(normalizePubId).find(x=>x.id===id);if(!p)return;document.getElementById('citeAPA').textContent=citationAPA(p);document.getElementById('citeMLA').textContent=citationMLA(p);document.getElementById('citeChicago').textContent=citationChicago(p);document.getElementById('citeBib').textContent=citationBib(p);document.getElementById('citationModal').classList.add('open')}
function closeCitationModal(){document.getElementById('citationModal').classList.remove('open')}
async function copyCitation(id){await navigator.clipboard.writeText(document.getElementById(id).textContent);alert('Copied')}

// generic json helpers
function downloadJSON(data,name){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click()}
function readJsonFile(e,cb){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d))cb(d);else alert('JSON phải là array')}catch(err){alert('JSON không hợp lệ')}};r.readAsText(f);e.target.value=''}

// github api
function getToken(){let t=localStorage.getItem('gh_token');if(!t){t=prompt('Nhập GitHub PAT (Contents: Read/Write):');if(t)localStorage.setItem('gh_token',t)}return t}
async function putGitHubJson(path,data,message,statusId){const token=getToken();if(!token)return;setStatus(statusId,'Đang publish...');const meta=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}?ref=${GH_BRANCH}`,{headers:{Authorization:`token ${token}`}});let sha='';if(meta.ok){sha=(await meta.json()).sha}const content=btoa(unescape(encodeURIComponent(JSON.stringify(data,null,2))));const res=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${path}`,{method:'PUT',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({message,content,sha,branch:GH_BRANCH})});if(!res.ok){const e=await res.json();throw new Error(e.message||res.status)}setStatus(statusId,'Publish OK. GitHub Pages cập nhật sau 1-2 phút')}
async function publishNewsToGitHub(){try{await putGitHubJson(NEWS_PATH,news,`Update news: ${new Date().toISOString().slice(0,16)}`,'newsStatus')}catch(e){setStatus('newsStatus','Lỗi: '+e.message)}}
async function publishPubsToGitHub(){try{await putGitHubJson(PUBS_PATH,pubs,`Update publications: ${new Date().toISOString().slice(0,16)}`,'pubStatus')}catch(e){setStatus('pubStatus','Lỗi: '+e.message)}}

// scholar sync trigger via workflow_dispatch
async function syncScholarNow(){const token=getToken();if(!token)return;setStatus('pubStatus','Đang gọi workflow Scholar sync...');try{const res=await fetch(`https://api.github.com/repos/${GH_REPO}/actions/workflows/scholar-sync.yml/dispatches`,{method:'POST',headers:{Authorization:`token ${token}`,'Content-Type':'application/json'},body:JSON.stringify({ref:'main'})});if(!res.ok)throw new Error('Workflow dispatch failed');setStatus('pubStatus','Workflow Scholar sync đã được kích hoạt. Đợi 1-3 phút rồi reload.') }catch(e){setStatus('pubStatus','Lỗi sync: '+e.message)}}

loadAll();
