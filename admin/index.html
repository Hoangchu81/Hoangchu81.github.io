<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Quản lý Tin tức — TS. Chử Đức Hoàng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Crimson+Pro:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--fg:#09090b;--muted:#60646c;--line:#e4e4e7;--accent:#2563eb;--paper:#fff;--radius:16px;--shadow:0 8px 30px rgba(0,0,0,.07)}*{box-sizing:border-box}body{margin:0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;background:var(--bg);color:var(--fg);line-height:1.5}a{color:var(--accent);text-decoration:none}h1,h2,h3{font-family:'Crimson Pro',Georgia,serif;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}header{background:var(--paper);border-bottom:1px solid var(--line);padding:16px 0;position:sticky;top:0;z-index:50}header .wrap{display:flex;align-items:center;justify-content:space-between}header h1{font-size:20px}.back{font-size:14px;font-weight:700;color:var(--muted)}.toolbar{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}.btn{display:inline-flex;align-items:center;gap:6px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;transition:.2s}.btn:hover{border-color:var(--accent);color:var(--accent)}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn.primary:hover{background:#1d4ed8}.btn.danger{color:#dc2626;border-color:#fecaca}.btn.danger:hover{background:#fef2f2}input,select,textarea{font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;width:100%;background:#fff;transition:.2s}input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.12)}textarea{min-height:80px;resize:vertical}.search{max-width:320px}.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--line);background:#fff;box-shadow:var(--shadow)}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line)}th{background:#f8fafc;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:none}tr:hover td{background:#f8fafc}.badge{display:inline-block;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:700}.badge.sti{background:#ecfdf5;color:#059669}.badge.ai{background:#eff6ff;color:#2563eb}.badge.health{background:#fdf4ff;color:#a855f7}.actions{display:flex;gap:6px}.actions button{padding:6px 10px;border:none;border-radius:8px;cursor:pointer;font-size:12px;font-weight:700;background:#f1f5f9;color:var(--fg);transition:.15s}.actions button:hover{background:#e2e8f0}.actions .del:hover{background:#fee2e2;color:#dc2626}.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;place-items:center}.modal-overlay.open{display:grid}.modal{background:#fff;border-radius:20px;padding:28px;width:min(580px,92vw);max-height:88vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.18)}.modal h2{margin-bottom:16px;font-size:24px}.form-group{margin-bottom:14px}.form-group label{display:block;font-weight:700;font-size:13px;margin-bottom:5px;color:var(--muted)}.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.wysiwyg{border:1px solid var(--line);border-radius:10px;overflow:hidden}.wysiwyg-toolbar{display:flex;gap:2px;padding:6px;background:#f8fafc;border-bottom:1px solid var(--line)}.wysiwyg-toolbar button{padding:6px 10px;border:none;border-radius:6px;cursor:pointer;font-size:13px;background:transparent;font-weight:700}.wysiwyg-toolbar button:hover{background:#e2e8f0}.wysiwyg-editor{min-height:120px;padding:12px;outline:none;font-size:14px;line-height:1.6}.sortable-ghost{opacity:.4;background:#eff6ff}.drag-handle{cursor:grab;color:var(--muted);user-select:none}@media(max-width:768px){.form-row{grid-template-columns:1fr}.toolbar{flex-direction:column}.search{max-width:100%}table{font-size:13px}th,td{padding:8px 10px}}
</style>
</head>
<body>
<header><div class="wrap"><h1>📰 Quản lý Tin tức</h1><a class="back" href="index.html">← Về trang chủ</a></div></header>
<div class="wrap">
<div class="toolbar">
<button class="btn primary" onclick="openModal()">+ Thêm tin mới</button>
<button class="btn" onclick="exportJSON()">📥 Export JSON</button>
<button class="btn" onclick="importJSON()">📤 Import JSON</button>
<button class="btn primary" onclick="publishToGitHub()">🚀 Publish lên GitHub</button>
<input type="file" id="importFile" accept=".json" style="display:none" onchange="handleImport(event)">
<input class="search" type="search" placeholder="🔍 Tìm kiếm tin bài..." oninput="filterNews(this.value)">
<select style="width:auto" onchange="filterCat(this.value)"><option value="">Tất cả danh mục</option><option value="STI Policy">STI Policy</option><option value="AI & Digital">AI & Digital</option><option value="Digital Health">Digital Health</option><option value="Khác">Khác</option></select>
</div>
<div class="table-wrap">
<table>
<thead><tr><th width="30"></th><th width="30">#</th><th>Tiêu đề</th><th>Nguồn</th><th>Danh mục</th><th>Ngày</th><th width="120">Thao tác</th></tr></thead>
<tbody id="newsBody"></tbody>
</table>
</div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
<h2 id="modalTitle">Thêm tin mới</h2>
<div class="form-group"><label>Tiêu đề *</label><input id="fTitle" placeholder="Tiêu đề bài viết"></div>
<div class="form-row">
<div class="form-group"><label>Nguồn</label><input id="fSource" placeholder="vov.vn, mst.gov.vn..."></div>
<div class="form-group"><label>Ngày đăng</label><input id="fDate" type="date"></div>
</div>
<div class="form-group"><label>URL bài viết</label><input id="fUrl" type="url" placeholder="https://..."></div>
<div class="form-row">
<div class="form-group"><label>Danh mục</label><select id="fCat"><option value="STI Policy">STI Policy</option><option value="AI & Digital">AI & Digital</option><option value="Digital Health">Digital Health</option><option value="Khác">Khác</option></select></div>
<div class="form-group"><label>Ảnh đại diện (URL)</label><input id="fImage" placeholder="https://... (tùy chọn)"></div>
</div>
<div class="form-group"><label>Tóm tắt / Trích dẫn</label>
<div class="wysiwyg"><div class="wysiwyg-toolbar"><button onclick="execCmd('bold')" title="Bold"><b>B</b></button><button onclick="execCmd('italic')" title="Italic"><i>I</i></button><button onclick="execCmd('underline')" title="Underline"><u>U</u></button><button onclick="execCmd('insertUnorderedList')" title="List">• List</button><button onclick="execCmd('createLink')" title="Link">🔗</button><button onclick="execCmd('removeFormat')" title="Clear">✕</button></div><div class="wysiwyg-editor" id="fExcerpt" contenteditable="true"></div></div>
</div>
<div class="form-actions">
<button class="btn" onclick="closeModal()">Hủy</button>
<button class="btn primary" id="btnSave" onclick="saveNews()">Lưu</button>
</div>
</div>
</div>

<script>
let news=[];let editId=null;let currentFilter='';let currentCat='';
const DATA_URL='data/news.json';
const body=document.getElementById('newsBody');

async function loadNews(){try{const r=await fetch(DATA_URL+'?t='+Date.now());news=await r.json();render()}catch(e){news=JSON.parse(localStorage.getItem('news_data')||'[]');render()}}

function persist(){localStorage.setItem('news_data',JSON.stringify(news));render();saveToFile()}

function saveToFile(){const blob=new Blob([JSON.stringify(news,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='news.json';/* For GitHub Pages static: download triggers manual upload or use API */}

function genId(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}

function render(){
let filtered=news;
if(currentFilter){const q=currentFilter.toLowerCase();filtered=filtered.filter(n=>(n.title+n.source+n.excerpt).toLowerCase().includes(q))}
if(currentCat)filtered=filtered.filter(n=>n.category===currentCat);
body.innerHTML=filtered.map((n,i)=>`<tr draggable="true" data-id="${n.id}" ondragstart="dragStart(event)" ondragover="dragOver(event)" ondrop="drop(event)">
<td class="drag-handle">⠿</td>
<td>${i+1}</td>
<td><a href="${esc(n.url)}" target="_blank">${esc(n.title)}</a></td>
<td>${esc(n.source)}</td>
<td><span class="badge ${catClass(n.category)}">${esc(n.category)}</span></td>
<td>${n.date||''}</td>
<td class="actions"><button onclick="editNews('${n.id}')">✏️</button><button class="del" onclick="deleteNews('${n.id}')">🗑</button></td>
</tr>`).join('')||'<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--muted)">Chưa có tin bài nào</td></tr>';
}

function catClass(c){if(c&&c.includes('STI'))return'sti';if(c&&c.includes('AI'))return'ai';if(c&&c.includes('Health'))return'health';return''}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML}

function filterNews(q){currentFilter=q;render()}
function filterCat(c){currentCat=c;render()}

function openModal(id){
editId=id||null;
document.getElementById('modalTitle').textContent=id?'Sửa tin bài':'Thêm tin mới';
if(id){const n=news.find(x=>x.id===id);if(n){document.getElementById('fTitle').value=n.title;document.getElementById('fSource').value=n.source;document.getElementById('fDate').value=n.date;document.getElementById('fUrl').value=n.url;document.getElementById('fCat').value=n.category;document.getElementById('fImage').value=n.image||'';document.getElementById('fExcerpt').innerHTML=n.excerpt||''}}else{document.getElementById('fTitle').value='';document.getElementById('fSource').value='';document.getElementById('fDate').value=new Date().toISOString().slice(0,10);document.getElementById('fUrl').value='';document.getElementById('fCat').value='STI Policy';document.getElementById('fImage').value='';document.getElementById('fExcerpt').innerHTML=''}
document.getElementById('modalOverlay').classList.add('open');
document.getElementById('fTitle').focus();
}
function closeModal(){document.getElementById('modalOverlay').classList.remove('open');editId=null}
function editNews(id){openModal(id)}

function saveNews(){
const title=document.getElementById('fTitle').value.trim();
if(!title){alert('Vui lòng nhập tiêu đề');return}
const obj={
id:editId||genId(),
title,
source:document.getElementById('fSource').value.trim(),
url:document.getElementById('fUrl').value.trim(),
date:document.getElementById('fDate').value,
category:document.getElementById('fCat').value,
excerpt:document.getElementById('fExcerpt').innerHTML.trim(),
image:document.getElementById('fImage').value.trim()
};
if(editId){const idx=news.findIndex(x=>x.id===editId);if(idx>=0)news[idx]=obj}else{news.unshift(obj)}
closeModal();persist();
}

function deleteNews(id){if(!confirm('Xóa tin này?'))return;news=news.filter(x=>x.id!==id);persist()}

function exportJSON(){const blob=new Blob([JSON.stringify(news,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='news.json';a.click()}
function importJSON(){document.getElementById('importFile').click()}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{try{const d=JSON.parse(ev.target.result);if(Array.isArray(d)){news=d;persist();alert('Import thành công: '+d.length+' tin')}}catch(err){alert('File JSON không hợp lệ')}};r.readAsText(f)}

function execCmd(cmd){if(cmd==='createLink'){const url=prompt('Nhập URL:');if(url)document.execCommand(cmd,false,url)}else{document.execCommand(cmd,false,null)}}

let draggedId=null;
function dragStart(e){draggedId=e.currentTarget.dataset.id;e.dataTransfer.effectAllowed='move'}
function dragOver(e){e.preventDefault();e.dataTransfer.dropEffect='move'}
function drop(e){e.preventDefault();const targetId=e.currentTarget.dataset.id;if(!draggedId||draggedId===targetId)return;const fromIdx=news.findIndex(x=>x.id===draggedId);const toIdx=news.findIndex(x=>x.id===targetId);const [item]=news.splice(fromIdx,1);news.splice(toIdx,0,item);persist();draggedId=null}

loadNews();

// GitHub API auto-commit
const GH_REPO='Hoangchu81/Hoangchu81.github.io';
const GH_PATH='data/news.json';
const GH_BRANCH='main';

function getToken(){
let t=localStorage.getItem('gh_token');
if(!t){t=prompt('Nhập GitHub Personal Access Token (PAT) để publish:');if(t)localStorage.setItem('gh_token',t)}
return t;
}

async function publishToGitHub(){
const token=getToken();
if(!token){alert('Cần PAT để publish.');return}
const btn=event.target;btn.disabled=true;btn.textContent='⏳ Đang publish...';
try{
// Get current file SHA
const meta=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}?ref=${GH_BRANCH}`,{headers:{'Authorization':`token ${token}`}});
let sha='';
if(meta.ok){const j=await meta.json();sha=j.sha}
// Commit
const content=btoa(unescape(encodeURIComponent(JSON.stringify(news,null,2))));
const res=await fetch(`https://api.github.com/repos/${GH_REPO}/contents/${GH_PATH}`,{
method:'PUT',
headers:{'Authorization':`token ${token}`,'Content-Type':'application/json'},
body:JSON.stringify({message:`Update news: ${new Date().toISOString().slice(0,16)}`,content,sha,branch:GH_BRANCH})
});
if(res.ok){alert('✅ Đã publish lên GitHub thành công! Site sẽ cập nhật trong 1-2 phút.')}
else{const e=await res.json();alert('❌ Lỗi: '+(e.message||res.status))}
}catch(err){alert('❌ Lỗi kết nối: '+err.message)}
finally{btn.disabled=false;btn.textContent='🚀 Publish lên GitHub'}
}</script>
</body>
</html>
